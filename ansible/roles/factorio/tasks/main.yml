---
- name: Create the factorio group
  ansible.builtin.group:
    name: "{{ factorio_group }}"
    system: true

- name: Create the factorio service account
  ansible.builtin.user:
    name: "{{ factorio_user }}"
    group: "{{ factorio_group }}"
    shell: /usr/sbin/nologin
    system: true
    create_home: false

- name: Create the install directory
  ansible.builtin.file:
    path: "{{ factorio_install_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create the Factorio service data directory
  ansible.builtin.file:
    path: "{{ factorio_instances_base_dir }}"
    state: directory
    owner: root
    group: "{{ factorio_group }}"
    mode: "0750"

# Each version lives in <install_dir>-<version> and install_dir is a symlink to
# the active one, the layout the web console's engine upgrade also uses. With a
# channel ("stable"/"latest") Ansible only installs when nothing is installed,
# so it never undoes an upgrade or rollback made through the console. A pinned
# version is switched to exactly. Binaries stay root-owned so a compromised
# game process cannot rewrite them.
- name: Inspect the Factorio install path
  ansible.builtin.stat:
    path: "{{ factorio_install_dir }}"
    follow: false
  register: factorio_install_path

- name: Read the installed Factorio version
  ansible.builtin.slurp:
    src: "{{ factorio_install_dir }}/data/base/info.json"
  register: factorio_installed_info
  failed_when: false

- name: Record the installed Factorio version
  ansible.builtin.set_fact:
    factorio_installed_version: >-
      {{ (factorio_installed_info.content | b64decode | from_json).version
         if factorio_installed_info.content is defined else '' }}

- name: Look up the current Factorio release
  ansible.builtin.uri:
    url: https://factorio.com/api/latest-releases
    return_content: true
  register: factorio_latest_releases
  check_mode: false
  when:
    - factorio_version in ['stable', 'latest']
    - factorio_installed_version | length == 0

- name: Choose the Factorio version to run
  ansible.builtin.set_fact:
    factorio_target_version: >-
      {{ factorio_version if factorio_version not in ['stable', 'latest']
         else factorio_installed_version if factorio_installed_version | length > 0
         else factorio_latest_releases.json[
           'stable' if factorio_version == 'stable' else 'experimental'].headless }}

- name: Validate the Factorio version
  ansible.builtin.assert:
    that:
      - factorio_target_version is match('^[0-9]+\.[0-9]+\.[0-9]+$')
    fail_msg: "factorio_version must be stable, latest, or X.Y.Z, got {{ factorio_target_version }}"

- name: Install Factorio {{ factorio_target_version }}
  when: factorio_target_version != factorio_installed_version
  block:
    - name: Download the published Factorio checksums
      ansible.builtin.uri:
        url: https://factorio.com/download/sha256sums/
        return_content: true
      register: factorio_checksums
      check_mode: false

    - name: Find the headless checksum
      ansible.builtin.set_fact:
        factorio_headless_sha256: >-
          {{ factorio_checksums.content
             | regex_search('([0-9a-f]{64})\s+factorio-headless_linux_'
                            ~ (factorio_target_version | regex_escape) ~ '\.tar\.xz', '\1')
             | first }}

    - name: Create the download cache
      ansible.builtin.file:
        path: /var/cache/factorio
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Download the headless tarball
      ansible.builtin.get_url:
        url: "https://factorio.com/get-download/{{ factorio_target_version }}/headless/linux64"
        dest: "/var/cache/factorio/factorio-headless_linux_{{ factorio_target_version }}.tar.xz"
        checksum: "sha256:{{ factorio_headless_sha256 }}"
        owner: root
        group: root
        mode: "0644"

    - name: Create the version directory
      ansible.builtin.file:
        path: "{{ factorio_install_dir }}-{{ factorio_target_version }}"
        state: directory
        owner: root
        group: root
        mode: "0755"

    - name: Unpack Factorio {{ factorio_target_version }}
      ansible.builtin.unarchive:
        src: "/var/cache/factorio/factorio-headless_linux_{{ factorio_target_version }}.tar.xz"
        dest: "{{ factorio_install_dir }}-{{ factorio_target_version }}"
        remote_src: true
        extra_opts: [--strip-components=1, --no-same-owner]
        creates: "{{ factorio_install_dir }}-{{ factorio_target_version }}/bin/x64/factorio"
      when: not ansible_check_mode

    # Older deployments unpacked straight into the install directory.
    - name: Move a plain install directory to its versioned name
      ansible.builtin.command:
        argv:
          - mv
          - "{{ factorio_install_dir }}"
          - "{{ factorio_install_dir }}-{{ factorio_installed_version }}"
        creates: "{{ factorio_install_dir }}-{{ factorio_installed_version }}"
      when:
        - factorio_install_path.stat.isdir | default(false)
        - not (factorio_install_path.stat.islnk | default(false))
        - factorio_installed_version | length > 0

    - name: Keep the replaced version for rollback
      ansible.builtin.file:
        src: "{{ factorio_install_dir }}-{{ factorio_installed_version }}"
        dest: "{{ factorio_install_dir }}.previous"
        state: link
        force: true
      when: factorio_installed_version | length > 0

    - name: Activate Factorio {{ factorio_target_version }}
      ansible.builtin.file:
        src: "{{ factorio_install_dir }}-{{ factorio_target_version }}"
        dest: "{{ factorio_install_dir }}"
        state: link
        force: true
      register: factorio_activation

- name: Install the shared Factorio instance unit
  ansible.builtin.template:
    src: factorio@.service.j2
    dest: /etc/systemd/system/factorio@.service
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Configure Factorio instances
  ansible.builtin.include_tasks: instance.yml
  loop: "{{ factorio_instances }}"
  loop_control:
    loop_var: factorio_instance
    label: "{{ factorio_instance.id }}"

- name: Check whether the Factorio servers target exists
  ansible.builtin.stat:
    path: /etc/systemd/system/factorio-servers.target
  register: factorio_servers_target_unit

- name: Install the Factorio servers target
  ansible.builtin.template:
    src: factorio-servers.target.j2
    dest: /etc/systemd/system/factorio-servers.target
    owner: root
    group: root
    mode: "0644"
  notify: Reload systemd

- name: Apply the final systemd configuration
  ansible.builtin.meta: flush_handlers

- name: Enable and start all configured Factorio servers
  ansible.builtin.systemd_service:
    name: factorio-servers.target
    enabled: true
    state: started
    daemon_reload: true
  when: not ansible_check_mode or factorio_servers_target_unit.stat.exists
