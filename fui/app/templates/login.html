<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Factorio Server Control — Sign in</title>
<link rel="icon" href="{{ request.url_for('static', path='factorio-server-control.svg') }}" type="image/svg+xml">
<style>
  :root {
    color-scheme: dark;
    --black: #171717;
    --gray-dark: #313030;
    --gray-medium: #403f40;
    --gray-light: #8e8e8e;
    --cream: #ffe6c0;
    --orange: #e39827;
    --red: #cc4b47;
    --white: #f9f9f9;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 1.5rem;
         background-color: var(--black);
         background-image: linear-gradient(rgba(255, 255, 255, 0.018) 1px, transparent 1px),
                           linear-gradient(90deg, rgba(255, 255, 255, 0.018) 1px, transparent 1px);
         background-size: 32px 32px; color: var(--white);
         font: 15px/1.5 "Trebuchet MS", Verdana, sans-serif; }
  main { width: min(25rem, 100%); }
  .brand { display: flex; align-items: center; gap: 0.9rem; margin: 0 0 1rem; }
    .mark { width: 3.25rem; height: 3.25rem; flex: 0 0 auto;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.4)); }
  h1 { margin: 0; color: var(--cream); font-size: 1.25rem; line-height: 1.2; }
  .brand small { display: block; margin-top: 0.2rem; color: var(--gray-light); font-size: 0.72rem;
                 font-weight: 400; text-transform: uppercase; }
  .panel { padding: 1rem; border: 1px solid rgba(0, 0, 0, 0.48); border-top-color: rgba(255, 255, 255, 0.14);
           background: var(--gray-dark); box-shadow: 0 18px 38px rgba(0, 0, 0, 0.38); }
  h2 { margin: 0 0 0.7rem; color: var(--cream); font-size: 1.05rem; }
  .panel-body { padding: 1.3rem; border: 1px solid #282828; background: var(--gray-medium);
                box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.48); }
  label { display: block; margin-bottom: 0.35rem; color: #c1c1c1; font-size: 0.8rem; }
  input { width: 100%; min-height: 2.75rem; padding: 0.6rem 0.75rem; border: 1px solid #1f1f1f;
          border-radius: 1px; background: #202020; color: var(--white); font: inherit;
          box-shadow: inset 0 2px 5px rgba(0, 0, 0, 0.45); }
  input:focus { outline: 2px solid var(--orange); outline-offset: 1px; }
  button { width: 100%; min-height: 2.75rem; margin-top: 1rem; padding: 0.55rem 1rem;
           border: 1px solid rgba(0, 0, 0, 0.5); border-top-color: rgba(255, 255, 255, 0.22);
           border-radius: 1px; background: var(--orange); color: #171717; font: inherit;
           font-weight: 700; cursor: pointer; }
  button:hover { background: #f0aa3d; box-shadow: 0 0 5px rgba(227, 152, 39, 0.85); }
  .error { margin: 0 0 1rem; padding: 0.55rem 0.7rem; border-left: 3px solid var(--red);
           background: #2b2020; color: #ffaaa6; font-size: 0.85rem; }
  @media (max-width: 420px) {
    body { padding: 1rem; }
    .panel-body { padding: 1rem; }
  }
</style>
</head>
<body>
<main>
  <header class="brand">
    <img class="mark" src="{{ request.url_for('static', path='factorio-server-control.svg') }}" alt="">
    <h1>Factorio Server Control<small>Administration · v{{ version }}</small></h1>
  </header>
  <section class="panel">
    <h2>Sign in</h2>
    <div class="panel-body">
      {% if error %}<p class="error">{{ error }}</p>{% endif %}
      <form method="post" autocomplete="on">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" autocomplete="current-password"
               required autofocus>
        <button type="submit">Sign in</button>
      </form>
    </div>
  </section>
</main>
</body>
</html>
